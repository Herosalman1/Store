<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Salman Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight">🔐 GitHub Admin Portal</h1>
            <p class="text-xs text-zinc-400">Enter your GitHub Personal Access Token to manage store globally.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1">GitHub Personal Access Token (ghp_...)</label>
                <input type="password" id="githubToken" placeholder="Paste your GitHub token..." class="w-full px-4 py-3 rounded-xl bg-black border border-zinc-800 text-white text-sm focus:outline-none focus:border-rose-500">
            </div>
            <button onclick="saveToken()" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl transition-all shadow-lg">
                Connect & Login 🚀
            </button>
            <p id="errorMsg" class="text-xs text-rose-500 text-center hidden">Please enter a valid GitHub Token!</p>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-zinc-500 hover:text-white transition-colors">← Back to Store</a>
        </div>
    </div>

    <script>
        function saveToken() {
            const token = document.getElementById('githubToken').value.trim();
            if (token.startsWith('ghp_') || token.length > 20) {
                localStorage.setItem('githubToken', token);
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'tools.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
