<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Salman Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#030712',
                        foreground: '#f3f4f6',
                        brand: '#f43f5e'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #030712; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .input-pro { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .input-pro:focus { border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.25); outline: none; }
        
        .btn-uniform {
            background-color: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-uniform:hover { background-color: rgba(55, 65, 81, 1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel p-8 rounded-2xl w-full max-w-md border border-zinc-800 shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold tracking-wide text-white">🔐 Admin Control Room</h2>
            <p class="text-xs text-zinc-400 mt-1">Enter your GitHub Personal Access Token</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1">GitHub Token:</label>
                <input type="password" id="gitToken" class="input-pro w-full px-4 py-3 rounded-xl text-sm" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>

            <button id="loginBtn" onclick="verifyAndLogin()" class="w-full py-3 rounded-xl bg-brand text-white font-semibold text-sm hover:bg-rose-600 transition-all shadow-lg shadow-rose-600/25">
                LOGIN & OPEN DASHBOARD ⚡
            </button>
        </div>
    </div>

    <script>
        async function verifyAndLogin() {
            const token = document.getElementById('gitToken').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!token) {
                btn.innerText = "⚠️ ENTER TOKEN FIRST!";
                btn.style.background = "#d97706";
                setTimeout(() => {
                    btn.innerText = "LOGIN & OPEN DASHBOARD ⚡";
                    btn.style.background = "#f43f5e";
                }, 2000);
                return;
            }

            btn.innerText = "VERIFYING... ⏳";
            btn.style.background = "#1f6feb";

            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${token}` }
                });

                if(response.ok) {
                    localStorage.setItem('gitToken', token);
                    
                    btn.innerText = "SUCCESS! OPENING... ✅";
                    btn.style.background = "#238636";

                    setTimeout(() => {
                        window.location.href = "tools.html";
                    }, 1000);
                } else {
                    throw new Error("Invalid token");
                }
            } catch (error) {
                btn.innerText = "❌ INVALID TOKEN! TRY AGAIN";
                btn.style.background = "#da3633";

                setTimeout(() => {
                    btn.innerText = "LOGIN & OPEN DASHBOARD ⚡";
                    btn.style.background = "#f43f5e";
                }, 2500);
            }
        }
    </script>
</body>
</html>
