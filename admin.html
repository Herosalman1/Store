<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Admin Dashboard</title>
    <meta name="viewport" content="width=1024">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 20px; max-width: 650px; margin: auto; display: flex; flex-direction: column; min-height: 100vh; justify-content: center;}
        .box { background: #161b22; padding: 30px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #010409; color: white; border: 1px solid #30363d; border-radius: 8px; font-size: 14px;}
        input:focus, textarea:focus { border-color: #00ff88; outline: none; }
        button { padding: 14px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; transition: 0.3s;}
        
        .btn-green { background: #238636; color: white; }
        .btn-green:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; color: white; }
        .btn-blue:hover { background: #388bfd; }
        .btn-orange { background: #d29922; color: white; }
        .btn-orange:hover { background: #e3b341; }
        .btn-red { background: #da3633; color: white; padding: 6px 12px; width: auto; font-size: 12px;}
        .btn-red:hover { background: #f85149; }
        .btn-yellow { background: #9e6a03; color: white; padding: 6px 12px; width: auto; font-size: 12px; margin-right: 5px;}
        .btn-yellow:hover { background: #bb8009; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 12px; background: #010409; border-radius: 8px; border: 1px solid #30363d; text-align: left; }
        .action-btns { display: flex; align-items: center; flex-shrink: 0; }
        h2, h3 { color: #00ff88; margin-top: 0;}

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; width: 90%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { color: #da3633; font-size: 28px; font-weight: bold; cursor: pointer; background: none; border: none; width: auto; padding: 0; }
        #projectList { overflow-y: auto; padding-right: 5px; flex-grow: 1; }
    </style>
</head>
<body>

    <div class="box" id="loginSection">
        <h2>🔒 Store Control Room</h2>
        <p style="color: #8b949e; font-size: 14px; margin-bottom: 20px;">Enter GitHub Token to manage store</p>
        
        <input type="password" id="gitToken" placeholder="GitHub Personal Access Token">
        <button class="btn-green" onclick="loadData()">LOGIN & LOAD STORE</button>
    </div>

    <div class="box" id="editorSection" style="display:none; text-align: left; margin-top: 0;">
        <h3 id="formTitle" style="color:#00ea77; text-align: center;">➕ Add New Template / Code</h3>
        
        <label style="font-size:12px; color:#8b949e;">Template Name:</label>
        <input type="text" id="pName" placeholder="E.g. Cinematic Birthday">
        
        <label style="font-size:12px; color:#8b949e;">Price (₹):</label>
        <input type="number" id="pPrice" placeholder="249">

        <label style="font-size:12px; color:#8b949e;">Preview Image URL:</label>
        <input type="text" id="pImg" placeholder="https://images.unsplash.com/...">

        <label style="font-size:12px; color:#8b949e;">Live Demo Link:</label>
        <input type="text" id="pDemo" placeholder="rakhi.html">

        <label style="font-size:12px; color:#8b949e;">Short Description:</label>
        <textarea id="pDesc" rows="2" placeholder="Write short details about this code..."></textarea>
        
        <button id="actionBtn" class="btn-green" style="background:#00ea77; color:black; margin-top: 10px;" onclick="processTool()">ADD TO LIST</button>
        
        <button class="btn-orange" style="margin-top:25px;" onclick="openModal()">📋 VIEW SAVED TEMPLATES LIST</button>
        <button class="btn-blue" style="margin-top:15px;" onclick="saveToGitHub()">🚀 UPLOAD TO GITHUB</button>
    </div>

    <!-- List Modal Box -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 ALL TEMPLATES LIST</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="projectList"></div>
        </div>
    </div>

    <script>
        const myRepo = "Herosalman1/all-tools-dashboard"; 
        let toolsArray = [];
        let fileSha = "";
        let editIndex = null; 

        async function loadData() {
            const token = document.getElementById('gitToken').value.trim();
            if(!token) return alert("Bhai, GitHub Token daalna zaroori hai!");

            const loginBtn = document.querySelector('#loginSection .btn-green');
            loginBtn.innerText = "LOADING...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if(!response.ok) throw new Error("Key galat hai!");
                
                const data = await response.json();
                fileSha = data.sha;
                const decodedData = decodeURIComponent(escape(atob(data.content)));
                toolsArray = JSON.parse(decodedData);
                
                // Store token in localStorage for session
                localStorage.setItem('gitToken', token);

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                renderList();
            } catch (error) {
                alert("Error! Token ya repository check karo.");
                loginBtn.innerText = "LOGIN & LOAD STORE";
            }
        }

        function renderList() {
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            toolsArray.forEach((tool, index) => {
                let price = tool.price || '249';
                list.innerHTML += `
                    <div class="list-item">
                        <div style="display: flex; align-items: center; flex: 1; padding-right: 10px;">
                            <span style="font-size: 14px; font-weight: 500; word-break: break-word;">
                                ${index + 1}. ${tool.name} (₹${price})
                            </span>
                        </div>
                        <div class="action-btns">
                            <button class="btn-yellow" onclick="editTool(${index})">EDIT</button>
                            <button class="btn-red" onclick="deleteTool(${index})">DELETE</button>
                        </div>
                    </div>`;
            });
        }

        function processTool() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const img = document.getElementById('pImg').value.trim();
            const demo = document.getElementById('pDemo').value.trim();
            const desc = document.getElementById('pDesc').value.trim();
            
            if(!name || !price) {
                return alert("Template Name and Price are required!");
            }

            const itemObj = {
                name,
                price,
                img: img || 'https://images.unsplash.com/photo-1606744824163-985d376605aa?q=80&w=500&auto=format&fit=crop',
                demo: demo || '#',
                desc: desc || 'Premium animated web template.'
            };

            if(editIndex === null) {
                toolsArray.push(itemObj);
            } else {
                toolsArray[editIndex] = itemObj;
                editIndex = null;
                document.getElementById('formTitle').innerText = "➕ Add New Template / Code";
                document.getElementById('actionBtn').innerText = "ADD TO LIST";
                document.getElementById('actionBtn').style.background = "#238636";
                document.getElementById('actionBtn').style.color = "white";
            }

            document.getElementById('pName').value = "";
            document.getElementById('pPrice').value = "";
            document.getElementById('pImg').value = "";
            document.getElementById('pDemo').value = "";
            document.getElementById('pDesc').value = "";
            
            renderList();
            closeModal();
            alert("Added to list! Click 'UPLOAD TO GITHUB' to save globally.");
        }

        function editTool(index) {
            editIndex = index;
            let item = toolsArray[index];
            document.getElementById('pName').value = item.name || '';
            document.getElementById('pPrice').value = item.price || '';
            document.getElementById('pImg').value = item.img || '';
            document.getElementById('pDemo').value = item.demo || item.url || '';
            document.getElementById('pDesc').value = item.desc || '';
            
            document.getElementById('formTitle').innerText = "✏️ Edit Template";
            document.getElementById('actionBtn').innerText = "UPDATE TEMPLATE";
            document.getElementById('actionBtn').style.background = "#d29922";
            document.getElementById('actionBtn').style.color = "white";
            
            closeModal();
        }

        function deleteTool(index) {
            if(confirm("Are you sure you want to delete this template?")) {
                toolsArray.splice(index, 1);
                renderList();
            }
        }

        async function saveToGitHub() {
            const token = localStorage.getItem('gitToken');
            const updatedJson = JSON.stringify(toolsArray, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

            const uploadBtn = document.querySelector('.btn-blue');
            uploadBtn.innerText = "SAVING TO GITHUB...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Updated store templates via Admin Panel",
                        content: encodedContent,
                        sha: fileSha
                    })
                });

                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                    alert("✅ Successfully updated and published to GitHub!");
                    uploadBtn.innerText = "🚀 UPLOAD TO GITHUB";
                } else {
                    throw new Error("Save error");
                }
            } catch (error) {
                alert("Failed to save! Check your token.");
                uploadBtn.innerText = "🚀 UPLOAD TO GITHUB";
            }
        }

        function openModal() {
            renderList();
            document.getElementById('listModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('listModal').style.display = 'none';
        }
    </script>
</body>
</html>
