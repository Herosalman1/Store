<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Store Admin Control Room</title>
    <meta name="viewport" content="width=1024">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 20px; max-width: 700px; margin: auto; display: flex; flex-direction: column; min-height: 100vh; }
        .box { background: #161b22; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #010409; color: white; border: 1px solid #30363d; border-radius: 8px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #00ff88; outline: none; }
        button { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; transition: 0.3s; }
        
        .btn-green { background: #238636; color: white; }
        .btn-green:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; color: white; }
        .btn-blue:hover { background: #388bfd; }
        .btn-orange { background: #d29922; color: white; }
        .btn-orange:hover { background: #e3b341; }
        .btn-red { background: #da3633; color: white; padding: 6px 12px; width: auto; font-size: 12px; }
        .btn-red:hover { background: #f85149; }
        .btn-yellow { background: #9e6a03; color: white; padding: 6px 12px; width: auto; font-size: 12px; margin-right: 5px; }
        .btn-yellow:hover { background: #bb8009; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 12px; background: #010409; border-radius: 8px; border: 1px solid #30363d; text-align: left; }
        .action-btns { display: flex; align-items: center; flex-shrink: 0; }
        h2, h3 { color: #00ff88; margin-top: 0; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; width: 90%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { color: #da3633; font-size: 28px; font-weight: bold; cursor: pointer; background: none; border: none; width: auto; padding: 0; }
        #projectList { overflow-y: auto; padding-right: 5px; flex-grow: 1; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div class="box" id="loginSection">
        <h2>🔒 Store Control Room</h2>
        <p style="color: #8b949e; font-size: 14px; margin-bottom: 20px;">Enter GitHub Token to access full control panel</p>
        
        <input type="password" id="gitToken" placeholder="GitHub Personal Access Token">
        <button class="btn-green" onclick="loadData()">LOGIN & LOAD PANEL</button>
    </div>

    <!-- MAIN DASHBOARD EDITOR SECTION -->
    <div id="editorSection" style="display:none;">
        
        <!-- SECTION 1: PROFILE CUSTOMIZE -->
        <div class="box">
            <h3>👤 1. Profile Customization</h3>
            <label style="font-size:12px; color:#8b949e;">Profile Picture (DP) URL:</label>
            <input type="text" id="pDp" placeholder="https://...">

            <label style="font-size:12px; color:#8b949e;">Bio Text:</label>
            <textarea id="pBio" rows="3" placeholder="Write your profile bio here..."></textarea>

            <label style="font-size:12px; color:#8b949e;">Instagram Link:</label>
            <input type="text" id="pInsta" placeholder="https://www.instagram.com/...">

            <label style="font-size:12px; color:#8b949e;">Telegram Username (for Buy button):</label>
            <input type="text" id="pTele" placeholder="Superfast_01">
        </div>

        <!-- SECTION 2: CODE UPLOAD & EDIT SYSTEM -->
        <div class="box">
            <h3 id="formTitle">📤 2. Code Upload & Edit System</h3>
            
            <label style="font-size:12px; color:#8b949e;">Template Name:</label>
            <input type="text" id="tName" placeholder="E.g. Cinematic Birthday">
            
            <label style="font-size:12px; color:#8b949e;">Price (₹):</label>
            <input type="number" id="tPrice" placeholder="249">

            <label style="font-size:12px; color:#8b949e;">Preview Image URL:</label>
            <input type="text" id="tImg" placeholder="https://images.unsplash.com/...">

            <label style="font-size:12px; color:#8b949e;">Live Demo Link:</label>
            <input type="text" id="tDemo" placeholder="rakhi.html">

            <label style="font-size:12px; color:#8b949e;">Short Description:</label>
            <textarea id="tDesc" rows="2" placeholder="Write short details about this code..."></textarea>
            
            <button id="actionBtn" class="btn-green" style="background:#00ea77; color:black; margin-top: 10px;" onclick="processTemplate()">ADD CODE TO LIST</button>
            
            <button class="btn-orange" style="margin-top:20px;" onclick="openModal()">📋 MANAGE / EDIT / DELETE CODES</button>
        </div>

        <!-- SECTION 3: GLOBAL UPLOAD TO GITHUB -->
        <div class="box" style="text-align: center;">
            <h3>🚀 3. Publish Changes</h3>
            <p style="color:#8b949e; font-size:12px; margin-bottom:15px;">Profile aur Codes dono ko ek sath live store par update karne ke liye niche click karein.</p>
            <button class="btn-blue" onclick="saveToGitHub()">SAVE & UPLOAD EVERYTHING TO GITHUB</button>
        </div>

    </div>

    <!-- List Modal Box for Edit/Delete -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 ALL UPLOADED CODES</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="projectList"></div>
        </div>
    </div>

    <script>
        const myRepo = "Herosalman1/all-tools-dashboard"; 
        let storeData = { profile: {}, templates: [] };
        let fileSha = "";
        let editIndex = null; 

        async function loadData() {
            const token = document.getElementById('gitToken').value.trim();
            if(!token) return alert("Bhai, GitHub Token daalna zaroori hai!");

            const loginBtn = document.querySelector('#loginSection .btn-green');
            loginBtn.innerText = "LOADING...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    let parsed = JSON.parse(decodedData);
                    
                    // Handle backward compatibility (if file had old array format or new object format)
                    if(Array.isArray(parsed)) {
                        storeData.templates = parsed;
                        storeData.profile = {
                            dp: "https://avatars.githubusercontent.com/u/213235513?s=400&u=e78a19fe3543b47afabf3d6235a9901a38ddd5f4&v=4",
                            bio: "SALMAN he/him\nAI creator & Web Developer",
                            insta: "https://www.instagram.com/herosalman1_929/",
                            telegram: "Superfast_01"
                        };
                    } else {
                        storeData = parsed;
                    }
                }
                
                // Fill Profile Fields
                document.getElementById('pDp').value = storeData.profile.dp || '';
                document.getElementById('pBio').value = storeData.profile.bio || '';
                document.getElementById('pInsta').value = storeData.profile.insta || '';
                document.getElementById('pTele').value = storeData.profile.telegram || '';

                localStorage.setItem('gitToken', token);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
            } catch (error) {
                alert("Error! Token ya repository check karo.");
                loginBtn.innerText = "LOGIN & LOAD PANEL";
            }
        }

        function renderList() {
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            if(!storeData.templates || storeData.templates.length === 0) {
                list.innerHTML = `<p style="color:#8b949e; text-align:center;">No codes uploaded yet.</p>`;
                return;
            }
            storeData.templates.forEach((tool, index) => {
                let price = tool.price || '249';
                list.innerHTML += `
                    <div class="list-item">
                        <div style="display: flex; align-items: center; flex: 1; padding-right: 10px;">
                            <span style="font-size: 14px; font-weight: 500; word-break: break-word;">
                                ${index + 1}. ${tool.name} (₹${price})
                            </span>
                        </div>
                        <div class="action-btns">
                            <button class="btn-yellow" onclick="editTemplate(${index})">EDIT</button>
                            <button class="btn-red" onclick="deleteTemplate(${index})">DELETE</button>
                        </div>
                    </div>`;
            });
        }

        function processTemplate() {
            const name = document.getElementById('tName').value.trim();
            const price = document.getElementById('tPrice').value.trim();
            const img = document.getElementById('tImg').value.trim();
            const demo = document.getElementById('tDemo').value.trim();
            const desc = document.getElementById('tDesc').value.trim();
            
            if(!name || !price) {
                return alert("Template Name and Price are required!");
            }

            const itemObj = {
                name,
                price,
                img: img || 'https://images.unsplash.com/photo-1606744824163-985d376605aa?q=80&w=500&auto=format&fit=crop',
                demo: demo || '#',
                desc: desc || 'Premium animated web template.'
            };

            if(editIndex === null) {
                storeData.templates.unshift(itemObj);
            } else {
                storeData.templates[editIndex] = itemObj;
                editIndex = null;
                document.getElementById('formTitle').innerText = "📤 2. Code Upload & Edit System";
                document.getElementById('actionBtn').innerText = "ADD CODE TO LIST";
                document.getElementById('actionBtn').style.background = "#238636";
                document.getElementById('actionBtn').style.color = "white";
            }

            document.getElementById('tName').value = "";
            document.getElementById('tPrice').value = "";
            document.getElementById('tImg').value = "";
            document.getElementById('tDemo').value = "";
            document.getElementById('tDesc').value = "";
            
            alert("Code added/updated locally! Don't forget to click 'SAVE & UPLOAD EVERYTHING TO GITHUB' at the bottom.");
        }

        function editTemplate(index) {
            editIndex = index;
            let item = storeData.templates[index];
            document.getElementById('tName').value = item.name || '';
            document.getElementById('tPrice').value = item.price || '';
            document.getElementById('tImg').value = item.img || '';
            document.getElementById('tDemo').value = item.demo || item.url || '';
            document.getElementById('tDesc').value = item.desc || '';
            
            document.getElementById('formTitle').innerText = "✏️ Edit Template Code";
            document.getElementById('actionBtn').innerText = "UPDATE CODE";
            document.getElementById('actionBtn').style.background = "#d29922";
            document.getElementById('actionBtn').style.color = "white";
            
            closeModal();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function deleteTemplate(index) {
            if(confirm("Are you sure you want to delete this code?")) {
                storeData.templates.splice(index, 1);
                renderList();
            }
        }

        async function saveToGitHub() {
            const token = localStorage.getItem('gitToken');
            
            // Update profile info from inputs before saving
            storeData.profile = {
                dp: document.getElementById('pDp').value.trim(),
                bio: document.getElementById('pBio').value,
                insta: document.getElementById('pInsta').value.trim(),
                telegram: document.getElementById('pTele').value.trim()
            };

            const updatedJson = JSON.stringify(storeData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

            const uploadBtn = document.querySelector('.box:last-child .btn-blue');
            uploadBtn.innerText = "SAVING TO GITHUB...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/tools.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Updated profile and templates via Admin Panel",
                        content: encodedContent,
                        sha: fileSha
                    })
                });

                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                    alert("✅ Successfully updated profile & codes globally on GitHub!");
                    uploadBtn.innerText = "🚀 SAVE & UPLOAD EVERYTHING TO GITHUB";
                } else {
                    throw new Error("Save error");
                }
            } catch (error) {
                alert("Failed to save! Check your token or internet connection.");
                uploadBtn.innerText = "🚀 SAVE & UPLOAD EVERYTHING TO GITHUB";
            }
        }

        function openModal() {
            renderList();
            document.getElementById('listModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('listModal').style.display = 'none';
        }
    </script>
</body>
</html>
